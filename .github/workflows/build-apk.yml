name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_patched_core:
        description: "Build AAR from patched ray2sing (Reality/Xray). Slow; needs Go+NDK."
        type: boolean
        default: false

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "dev"
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c
  # Match hiddify-core go.mod at HIDDIFY_CORE_COMMIT (gomobile AAR build).
  GO_VERSION: '1.25.6'
  HIDDIFY_CORE_COMMIT: a82d2b8f047ce769caad42ad9d3ab2c0ef53208a
  RAY2SING_COMMIT: c0c298d371a0bcfbcc70a6276153178ec6e9c4e1
  SINGBOX_COMMIT: 3a1c923e306d5b39cde8f2c02ec9dd556ea112d3
  # Pin libbox AAR when not building from source; "draft" floats and breaks Android PlatformInterface.
  CORE_AAR_URL: https://github.com/hiddify/hiddify-next-core/releases/download/v4.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Clone hiddify-core deps (HTTPS, pinned)
        run: |
          set -euo pipefail
          rm -rf hiddify-core
          git clone --filter=blob:none https://github.com/hiddify/hiddify-core.git hiddify-core
          git -C hiddify-core fetch --depth 1 origin "${HIDDIFY_CORE_COMMIT}"
          git -C hiddify-core checkout "${HIDDIFY_CORE_COMMIT}"

          # go.mod: replace ray2sing => ./ray2sing (must be inside hiddify-core)
          rm -rf hiddify-core/ray2sing
          git clone https://github.com/hiddify/ray2sing.git hiddify-core/ray2sing
          git -C hiddify-core/ray2sing checkout "${RAY2SING_COMMIT}"

          rm -rf hiddify-core/hiddify-sing-box
          git clone https://github.com/hiddify/hiddify-sing-box.git hiddify-core/hiddify-sing-box
          git -C hiddify-core/hiddify-sing-box fetch --depth 1 origin "${SINGBOX_COMMIT}" || true
          git -C hiddify-core/hiddify-sing-box checkout "${SINGBOX_COMMIT}"

          echo "✅ hiddify-core @ ${HIDDIFY_CORE_COMMIT}"
          echo "✅ ray2sing @ $(git -C hiddify-core/ray2sing rev-parse --short HEAD)"
          echo "✅ hiddify-sing-box @ $(git -C hiddify-core/hiddify-sing-box rev-parse --short HEAD)"

      - name: Apply ray2sing Reality/Xray patches
        run: bash scripts/apply-ray2sing-patches.sh

      - name: Clean up disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Add Swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
        continue-on-error: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Go
        if: ${{ inputs.build_patched_core }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            hiddify-core/go.sum
            hiddify-core/hiddify-sing-box/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        if: ${{ inputs.build_patched_core }}
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Setup signing keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p .github/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > .github/signing/release.keystore
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-tiknet123}"
          KEY_ALIAS="${ANDROID_KEYSTORE_ALIAS:-tiknet}"
          echo "storePassword=$STORE_PASS" > android/key.properties
          echo "keyPassword=$STORE_PASS" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=../../.github/signing/release.keystore" >> android/key.properties
          echo "✅ Keystore restored from secret"

      - name: Install deps
        run: |
          make android-apk-install-deps || make android-aab-install-deps
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Prepare (geo + prebuilt AAR when not building patched core)
        if: ${{ !inputs.build_patched_core }}
        run: make android-apk-prepare CORE_URL="${{ env.CORE_AAR_URL }}" || make android-aab-prepare CORE_URL="${{ env.CORE_AAR_URL }}"

      - name: Prepare geo assets only (patched AAR path)
        if: ${{ inputs.build_patched_core }}
        run: |
          make common-prepare
          make get-geo-assets || true
          mkdir -p android/app/libs

      - name: Build patched Android AAR
        if: ${{ inputs.build_patched_core }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          # gomobile / node bits used by hiddify-core Makefile
          sudo apt-get update -qq
          sudo apt-get install -y -qq npm >/dev/null
          make build-android-libs
          ls -lh android/app/libs/

      - name: Fix TikNet PNGs for AAPT2
        run: |
          pip install --quiet Pillow
          python3 << 'EOF'
          from PIL import Image
          import os
          MAX = 4096
          for name in ['tiknet_splash.png', 'tiknet_launcher_foreground.png']:
            path = f'android/app/src/main/res/drawable/{name}'
            if os.path.isfile(path):
              img = Image.open(path)
              img = img.convert('RGBA')
              w, h = img.size
              if w > MAX or h > MAX:
                ratio = min(MAX / w, MAX / h)
                img = img.resize((int(w * ratio), int(h * ratio)), Image.Resampling.LANCZOS)
              img.save(path, 'PNG', compress_level=6)
              print(f"Fixed: {path}")
          EOF

      - name: Build APK
        run: make android-apk-release || flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p out
          APP_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "out/TikNet-arm64-${APP_VERSION}.apk" 2>/dev/null || true
          cp ./build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/TikNet-arm7-${APP_VERSION}.apk" 2>/dev/null || true
          cp ./build/app/outputs/flutter-apk/app-x86_64-release.apk "out/TikNet-x86_64-${APP_VERSION}.apk" 2>/dev/null || true
          cp ./build/app/outputs/flutter-apk/app-release.apk "out/TikNet-universal-${APP_VERSION}.apk" 2>/dev/null || true
          echo "=== APK Files ==="
          ls -lh out/
          if [ "${{ inputs.build_patched_core }}" = "true" ]; then
            echo "core=patched-ray2sing" > out/build-info.txt
          else
            echo "core=prebuilt-${{ env.CORE_AAR_URL }}" > out/build-info.txt
          fi
          cat out/build-info.txt

      - name: Upload ARM64 (گوشی‌های جدید)
        uses: actions/upload-artifact@v4
        with:
          name: TikNet-ARM64
          path: ./out/TikNet-arm64-*.apk
          retention-days: 30
        if: hashFiles('./out/TikNet-arm64-*.apk') != ''

      - name: Upload ARM7 (گوشی‌های قدیمی)
        uses: actions/upload-artifact@v4
        with:
          name: TikNet-ARM7
          path: ./out/TikNet-arm7-*.apk
          retention-days: 30
        if: hashFiles('./out/TikNet-arm7-*.apk') != ''

      - name: Upload x86_64 (امولاتور)
        uses: actions/upload-artifact@v4
        with:
          name: TikNet-x86_64
          path: ./out/TikNet-x86_64-*.apk
          retention-days: 30
        if: hashFiles('./out/TikNet-x86_64-*.apk') != ''

      - name: Upload Universal (همه)
        uses: actions/upload-artifact@v4
        with:
          name: TikNet-Universal
          path: ./out/TikNet-universal-*.apk
          retention-days: 30
        if: hashFiles('./out/TikNet-universal-*.apk') != ''

      - name: Upload build-info
        uses: actions/upload-artifact@v4
        with:
          name: TikNet-build-info
          path: ./out/build-info.txt
          retention-days: 30
