name: Build APK

on:
  workflow_dispatch:

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "dev"
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c
  HIDDIFY_CORE_COMMIT: a82d2b8f047ce769caad42ad9d3ab2c0ef53208a

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Clone hiddify-core and build deps
        run: |
          rm -rf hiddify-core hiddify-sing-box ray2sing
          git clone --depth 1 https://github.com/hiddify/hiddify-core.git hiddify-core
          cd hiddify-core
          git fetch --depth 1 origin "${HIDDIFY_CORE_COMMIT}"
          git checkout "${HIDDIFY_CORE_COMMIT}"
          cd ..
          git clone --depth 1 https://github.com/hiddify/hiddify-sing-box.git hiddify-sing-box
          git clone --depth 1 https://github.com/hiddify/ray2sing.git ray2sing
          echo "✅ hiddify-core @ ${HIDDIFY_CORE_COMMIT}"
          ls hiddify-core/

      - name: Clean up disk
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get autoremove -y
          sudo apt-get clean
          df -h

      - name: Add Swap
        run: |
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile 2>/dev/null || true
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
        continue-on-error: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup signing keystore from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          mkdir -p .github/signing
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > .github/signing/release.keystore
          STORE_PASS="${ANDROID_KEYSTORE_PASSWORD:-tiknet123}"
          KEY_ALIAS="${ANDROID_KEYSTORE_ALIAS:-tiknet}"
          echo "storePassword=$STORE_PASS" > android/key.properties
          echo "keyPassword=$STORE_PASS" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=../../.github/signing/release.keystore" >> android/key.properties
          echo "✅ Keystore restored from secret"

      - name: Install deps
        run: |
          make android-apk-install-deps || make android-aab-install-deps
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Prepare
        run: make android-apk-prepare || make android-aab-prepare

      - name: Fix TikNet PNGs for AAPT2
        run: |
          pip install --quiet Pillow
          python3 << 'EOF'
          from PIL import Image
          import os
          MAX = 4096
          for name in ['tiknet_splash.png', 'tiknet_launcher_foreground.png']:
            path = f'android/app/src/main/res/drawable/{name}'
            if os.path.isfile(path):
              img = Image.open(path)
              img = img.convert('RGBA')
              w, h = img.size
              if w > MAX or h > MAX:
                ratio = min(MAX / w, MAX / h)
                img = img.resize((int(w * ratio), int(h * ratio)), Image.Resampling.LANCZOS)
              img.save(path, 'PNG', compress_level=6)
              print(f"Fixed: {path}")
          EOF

      - name: Build APK
        run: make android-apk-release || flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          mkdir -p out
          cp ./build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/Hiddify-arm64.apk 2>/dev/null || true
          cp ./build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/Hiddify-arm7.apk 2>/dev/null || true
          cp ./build/app/outputs/flutter-apk/app-x86_64-release.apk out/Hiddify-x86_64.apk 2>/dev/null || true
          cp ./build/app/outputs/flutter-apk/app-release.apk out/Hiddify-universal.apk 2>/dev/null || true
          echo "=== APK Files ==="
          ls -lh out/

      - name: Upload ARM64 (گوشی‌های جدید)
        uses: actions/upload-artifact@v4
        with:
          name: Hiddify-ARM64-50MB
          path: ./out/Hiddify-arm64.apk
          retention-days: 30
        if: hashFiles('./out/Hiddify-arm64.apk') != ''

      - name: Upload ARM7 (گوشی‌های قدیمی)
        uses: actions/upload-artifact@v4
        with:
          name: Hiddify-ARM7-40MB
          path: ./out/Hiddify-arm7.apk
          retention-days: 30
        if: hashFiles('./out/Hiddify-arm7.apk') != ''

      - name: Upload x86_64 (امولاتور)
        uses: actions/upload-artifact@v4
        with:
          name: Hiddify-x86_64-60MB
          path: ./out/Hiddify-x86_64.apk
          retention-days: 30
        if: hashFiles('./out/Hiddify-x86_64.apk') != ''

      - name: Upload Universal (همه)
        uses: actions/upload-artifact@v4
        with:
          name: Hiddify-Universal-150MB
          path: ./out/Hiddify-universal.apk
          retention-days: 30
        if: hashFiles('./out/Hiddify-universal.apk') != ''
